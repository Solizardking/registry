# mcp-remote.yaml — pre-running remote MCP server example
#
# The registry catalogs the URL so agents can reference it; nothing is
# deployed or built. Use this for third-party SaaS MCP endpoints or
# servers you run yourself.
#
# Apply with:
#   arctl apply -f examples/mcp-remote.yaml
#
# To inspect tools on a remote endpoint:
#   npx -y @modelcontextprotocol/inspector --server-url <url>
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: databricks-unity-catalog
  tag: latest
spec:
  title: Databricks Unity Catalog
  description: "Pre-deployed Unity Catalog MCP server"
  remote:
    type: streamable-http # sse | streamable-http
    url: https://workspace.cloud.databricks.com/mcp
    # headers:                                  # optional: HTTP headers (e.g. auth tokens)
    #   - name: Authorization
    #     value: Bearer {token}

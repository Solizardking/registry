# clawd-perps-agent.yaml
#
# Register the Clawd Perps Agent in agentregistry.
# This provides Phoenix perpetuals market data, order execution, and margin views
# as a discoverable MCP server with associated skill documentation.
#
# Apply with: arctl apply -f examples/clawd-perps-agent.yaml
#
# Resources are defined in dependency order:
#   1. Perps Rise agent skill documentation
#   2. Perps MCP server (HTTP/SSE endpoint)
#   3. Perps agent bundling them together

# ── 1. Skill: Perps Rise Agent Documentation ─────────────────────────────────
apiVersion: ar.dev/v1alpha1
kind: Skill
metadata:
  name: clawd-perps-rise-agent
  tag: latest
  labels:
    app: clawd
    type: perps
    protocol: solana
spec:
  title: Clawd Perps Rise Agent
  description: >
    Rise SDK integration for Solana Phoenix perpetuals.
    Provides market data (orderbook, candles, funding, BBO),
    order execution (market, limit, stop-loss), margin status,
    and Hawkeye on-chain views — all via the @ellipsis-labs/rise SDK
    with Vulcan CLI fallback.
  source:
    repository:
      url: https://github.com/Solizardking/cheshire-terminal-main
      subfolder: core-ai/clawd-perps-agent/.claude/skills

---
# ── 2. MCP Server: Perps Agent HTTP API ──────────────────────────────────────
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: clawd-perps
  tag: stable
  labels:
    app: clawd
    type: perps
    protocol: solana
    transport: http
spec:
  title: Clawd Perps Agent
  description: >
    Solana Phoenix perpetuals MCP server.
    Provides 17 tools: market data (orderbook, candles, funding rates, BBO, stats),
    order execution (market orders, limit orders, stop-loss, cancel, deposit, withdraw),
    margin status via Hawkeye on-chain RPC, and Imperial Trading API health.
    Returns unsigned Solana instructions ready for wallet signing.
  # Pre-running remote server (not deployed by the registry).
  # Start the perps agent first: npm start  # serves at localhost:8080
  remote:
    type: streamable-http
    url: http://localhost:8080

---
# ── 3. Agent: Clawd Perps Trading Agent ──────────────────────────────────────
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: clawd-perps-trader
  tag: stable
  labels:
    app: clawd
    type: perps-trader
    protocol: solana
spec:
  title: Clawd Perps Trader
  description: >
    Solana perpetuals trading agent powered by the Phoenix Rise SDK.
    Reads real-time market data, builds unsigned order instructions,
    monitors margin and liquidation risk via Hawkeye on-chain RPC.
    Supports market, limit, and stop-loss orders across SOL, ETH, BTC perp markets.
    All order building is preview-safe by default; live mode requires explicit
    LIVE_TRADING=true + OPERATOR_CONFIRMED=true + PERPS_SIM_ONLY=false.
  modelProvider: anthropic
  modelName: claude-sonnet-4-20250514
  source:
    repository:
      url: https://github.com/Solizardking/cheshire-terminal-main
      subfolder: core-ai/clawd-perps-agent
  mcpServers:
    - kind: MCPServer
      name: clawd-perps
      tag: stable
